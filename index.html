<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Agenda Eventos</title>

    <link rel="stylesheet" href="styles.css" />

    <!-- ICONOS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <div class="container">

      <!-- HEADER -->
      <div class="header">
        <img
          src="./src/assets/GoldenGardenDarckTheme.png"
          class="logo"
          alt="logo"
        />
        <h1 class="tituloPrincipal">Agenda Eventos Golden Garden</h1>
      </div>

      <!-- SELECTOR DE EMPRESA -->
      <select id="empresaSelect" class="empresaSelect" onchange="cambiarEmpresa(this.value)">
        <option value="golden">Golden Garden</option>
        <option value="party">Hora de Fiesta</option>
      </select>

      <!-- FORM -->
      <div class="form">
        <div class="input-group">
          <i class="fa fa-hashtag"></i>
          <input id="titulo" class="inputStyle" placeholder="Título Evento" />
        </div>

        <div class="input-group">
          <i class="fa fa-align-left"></i>
          <input id="descripcion" class="inputStyle" placeholder="Descripción Evento" />
        </div>

        <div class="input-group">
          <i class="fa fa-calendar"></i>
          <input type="date" id="fecha" class="inputStyle" />
        </div>

        <button onclick="guardarEvento()">
          <i class="fa fa-save"></i> Guardar Evento
        </button>
      </div>

      <!-- 🔥 TOGGLE DE VISTA -->
      <div class="vista-toggle">
        <button onclick="mostrarLista()">
          <i class="fa fa-list"></i> Lista
        </button>
        <button onclick="mostrarCalendario()">
          <i class="fa fa-calendar"></i> Calendario
        </button>
      </div>

      <!-- CALENDARIO -->
      <div id="calendarioVista" class="calendario" style="display: none;">
        
        <div class="cal-header">
          <button onclick="cambiarMes(-1)">
            <i class="fa fa-chevron-left"></i>
          </button>

          <h3 id="mesActual"></h3>

          <button onclick="cambiarMes(1)">
            <i class="fa fa-chevron-right"></i>
          </button>
        </div>

        <div id="calGrid" class="cal-grid"></div>

      </div>

      <!-- COMPONENTE DE CARGA -->
      <div id="loader" style="display: none; text-align: center; padding: 20px">
        <i class="fa fa-spinner fa-spin"></i> Cargando eventos...
      </div>

      <!-- LISTA ORIGINAL -->
      <div id="listaEventos"></div>

    </div>

  <!-- 🔥 MODAL DETALLE -->
<div id="detalleOverlay" class="detalle-overlay">
  <div class="detalle-modal">

    <button class="detalle-close" onclick="cerrarDetalle()">✕</button>

    <div id="detalleContenido"></div>

  </div>
</div>

    <script type="module" src="app.js"></script>
  </body>
</html>
